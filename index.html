<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Heist Panic</title>
<style>
  :root {
    --bg: #14161f;
    --panel: #1d2030;
    --ink: #ecebe4;
    --muted: #9a9cb0;
    --yellow: #ffd43b;
    --denim: #4a7fd4;
    --goggle: #c7ccd6;
    --danger: #ff6b6b;
    --line: #2d3146;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 18px/1.65 Georgia, "Iowan Old Style", serif;
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
    border-bottom: 2px dashed var(--line); padding-bottom: 12px; margin-bottom: 24px;
    font-family: "Courier New", ui-monospace, monospace; font-size: 14px;
  }
  .logo { color: var(--yellow); font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
  .stats { display: flex; gap: 14px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .stats .chaos b { color: var(--danger); }
  .stats .nana b { color: var(--yellow); }
  button.restart {
    font: inherit; background: none; color: var(--muted); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  button.restart:hover { color: var(--ink); border-color: var(--muted); }
  .chapter {
    font-family: "Courier New", ui-monospace, monospace; font-size: 13px;
    color: var(--denim); text-transform: uppercase; letter-spacing: 2px; margin: 0 0 4px;
  }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 18px; color: var(--yellow); }
  .passage p { margin: 0 0 14px; }
  .say { font-weight: bold; }
  .gru { color: #9fc3ff; }
  .lucy { color: #7fe0c4; }
  .margo { color: #d5a6ff; }
  .edith { color: #ffa36b; }
  .agnes { color: #ff9fd1; }
  .minion { color: var(--yellow); font-style: italic; }
  .villain { color: #b4a6ff; }
  .sfx {
    display: inline-block; font-family: "Courier New", ui-monospace, monospace; font-weight: bold;
    color: #a6e36b; letter-spacing: 2px;
  }
  .note { color: var(--muted); font-style: italic; }
  .delta { font-family: "Courier New", ui-monospace, monospace; font-size: 14px; color: var(--muted); margin: -4px 0 16px; }
  ol.choices { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
  ol.choices button {
    width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--yellow);
    padding: 12px 16px; border-radius: 6px; cursor: pointer; transition: transform .08s, border-color .15s;
  }
  ol.choices button:hover, ol.choices button:focus-visible {
    border-color: var(--denim); border-left-color: var(--yellow); transform: translateX(4px); outline: none;
  }
  ol.choices .key { font-family: "Courier New", ui-monospace, monospace; color: var(--yellow); margin-right: 8px; }
  .theend {
    margin-top: 28px; padding: 16px; border: 2px dashed var(--yellow); border-radius: 8px; text-align: center;
    font-family: "Courier New", ui-monospace, monospace;
  }
  .theend strong { display: block; font-size: 22px; color: var(--yellow); letter-spacing: 4px; }
  .fade { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } ol.choices button { transition: none; } }
  @media (max-width: 480px) { body { font-size: 17px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🍌 Banana Heist Panic</span>
    <span class="stats">
      <span class="nana">Bananas recovered: <b id="s-bananas">0</b></span>
      <span class="chaos">Minion chaos: <b id="s-chaos">0</b></span>
    </span>
    <button class="restart" id="restart" type="button">↺ Restart</button>
  </header>
  <main id="passage" class="passage" aria-live="polite"></main>
</div>

<script id="story">
// Speaker helpers keep the story text readable.
function G(t) { return '<span class="say gru">GRU:</span> ' + t; }
function L(t) { return '<span class="say lucy">LUCY:</span> ' + t; }
function MA(t) { return '<span class="say margo">MARGO:</span> ' + t; }
function E(t) { return '<span class="say edith">EDITH:</span> ' + t; }
function A(t) { return '<span class="say agnes">AGNES:</span> ' + t; }
function MI(t) { return '<span class="say minion">MINIONS:</span> <span class="minion">' + t + '</span>'; }
function V(t) { return '<span class="say villain">DR. SNOOZEMONGER:</span> ' + t; }
function FX(t) { return '<span class="sfx">' + t + '</span>'; }
function N(t) { return '<span class="note">' + t + '</span>'; }

var STORY = {
  start: 'start',
  passages: {
    // ───────── CHAPTER 1: UH-OH ─────────
    start: {
      chapter: 'Chapter 1 · Uh-Oh', title: 'The Great Banana Alarm',
      text: [

        'A Minion is riding the alarm light like a rodeo bull. Another one is crying into an empty fruit bowl. Forty more are running in circles, screaming.',

        G('Calm down! CALM DOWN! What happened to the bananas?'),
        'A Minion holds up a newspaper upside down. The headline reads: <b>EVERY BANANA ON EARTH MYSTERIOUSLY VANISHES.</b>'

      choices: [
        { label: 'Run upstairs to watch the news with the girls', to: 'news' },
        { label: 'Call Lucy at the Anti-Villain League', to: 'lucy_call' },
        { label: 'Send the Minions to investigate (what could go wrong?)', to: 'minion_investigate', effects: { chaos: 2 } }
      ]
    },
    news: {
      chapter: 'Chapter 1 · Uh-Oh', title: 'Breaking News',
      text: [
        'Margo, Edith, and Agnes are on the couch. Kyle the dog is chewing a remote control that is not his.',
        'On TV, a man in silk pajamas and a nightcap waves from a floating fortress shaped like a giant pillow.',
        V('Greetings, world. I have taken ALL your bananas. They will power my <b>Eternal Nap Ray</b>, which will put the entire planet to sleep. Forever. Shhhhh.'),
        MA('Great. Another villain with a theme.'),
        E('Can we blow up his pillow? Please? I\'ll do my homework for a week.'),
        A('He looks sleepy. Maybe he just needs a hug.'),
        G('Nobody is hugging the villain.')

      choices: [
        { label: 'Head to the war room to make a plan', to: 'plan' },
        { label: 'Wait, why is Agnes packing a suitcase?', to: 'agnes_unicorn' }
      ]
    },
    lucy_call: {
      chapter: 'Chapter 1 · Uh-Oh', title: 'Agent Wilde Reporting',
      text: [
        'Before Gru can finish dialing, Lucy crashes through the skylight on a rope, does three cartwheels, and lands in a perfect pose.',
        L('Gru, honey! The AVL has a lead! The banana thief is <b>Dr. Snoozemonger</b>, the world\'s sleepiest supervillain.'),
        G('How did you get here so fast? I had not even pressed call yet.'),
        L('I was already on the roof. I like to be early! Also I brought my lipstick taser, my grappling hook, and snacks.'),
        N('The snacks are bananas. Forty Minion heads swivel toward Lucy at the exact same time.'),
        L('...Okay, the snacks are gone now.')
      ],
      choices: [
        { label: '"To the war room!"', to: 'plan', effects: { bananas: 1 } },
        { label: 'Check on the girls first', to: 'news' }

    minion_investigate: {

        FX('ZZZZZ... ba-na-naaa... zzz'),
        N('Minion chaos is rising. One of them has now put the slipper on his head.')

      choices: [

    edith_choice: {

        E('This one.'),
        'Inside is a big red rocket with a sticker that says "Totally Safe Missile."',
        G('Edith, no. I put that sticker on as a joke—'),
        'Edith has already pushed the big red button.',
        FX('...beep... beep... beepbeepbeep...')

      choices: [
        { label: 'RUN!!!', to: 'fail_boom', effects: { chaos: 2 } },
        { label: 'Throw it out the window, fast', to: 'fail_boom', effects: { chaos: 1 } }
      ]
    },
    fail_frozen: {
      chapter: 'Oops', title: 'Gru-sicle',
      text: [
        'Gru wiggles. The ice spreads. Gru wiggles harder. Now he is frozen up to the neck.',
        G('This... is fine.'),
        'The Minions hold a short funeral, then try to lick him because he looks like a giant ice pop.',
        MI('Mmm... Gru-lato!'),
        'Meanwhile, Dr. Snoozemonger is still stealing bananas. Somewhere a Minion is crying.',
        N('Let\'s pretend that didn\'t happen.')
      ],
      choices: [
        { label: '⏪ Rewind to the war room', to: 'plan' },
        { label: '⏪ Start the whole adventure over', to: 'start' }
      ]
    },
    fail_boom: {
      chapter: 'Oops', title: 'KA-BLAMMO',
      text: [
        FX('K A - B O O O O O M'),
        'When the smoke clears, the house has no roof. Gru\'s eyebrows are gone. Kyle is now a very fluffy, very angry ball of singed fur.',
        E('...Best. Day. Ever.'),
        MA('Our house is a convertible now.'),
        G('Edith, you are grounded until you are forty-five.'),
        N('The missile went straight through the roof and got stuck in a tree, so at least nobody was hurt. Try again?')
      ],
      choices: [
        { label: '⏪ Rewind to the war room', to: 'plan' },
        { label: '⏪ Start the whole adventure over', to: 'start' }
      ]
    },

    // ───────── CHAPTER 3: GETTING THERE ─────────
    travel_jet: {
      chapter: 'Chapter 3 · Getting There', title: 'Up, Up, and Uh-Oh',
      text: [
        'Everyone piles into Gru\'s jet. Kyle refuses to come out of the dryer, so Gru carries in the whole dryer.',

        L('Gru, honey, the pillow fortress is dead ahead! Who\'s flying?'),
        'Gru looks around. Somehow a Minion is in the pilot\'s seat wearing an aviator hat.'
      ],
      choices: [
        { label: 'Let the Minion fly. He looks confident.', to: 'minion_pilot', effects: { chaos: 2 } },

      ]
    },
    travel_catapult: {

      text: [

        FX('THWANNNNGGGG!!!'),
        G('WHY DID I AGREE TO THIIIIIIIS!'),
        A('WHEEEEEE!'),
        'They fly over three countries and land, softly but suspiciously, in the back of a big truck.',
        'Margo pulls back a tarp and gasps. The truck is <b>full of bananas</b>. It has a pillow logo on the side.',
        MA('Okay, I\'ll admit it. That actually worked.')
      ],
      choices: [
        { label: 'Hide in the banana truck and ride it to the lair', to: 'banana_truck', effects: { bananas: 3 } },
        { label: 'Jump out and go the rest of the way on foot', to: 'lair_entrance' }
      ]
    },
    banana_truck: {
      chapter: 'Chapter 3 · Getting There', title: 'Bananas. So Many Bananas.',
      text: [

        FX('*munch*'),
        'Several Minions have stowed away in the cargo. Their eyes glow in the dark like hungry little lanterns.',
        G('Do not. Eat. The evidence.'),
        MI('...Just one? Pwease?')
      ],
      choices: [
        { label: 'Stay strong. Guard the bananas!', to: 'lair_entrance', effects: { bananas: 2 } },
        { label: '"Okay, ONE banana each."', to: 'fail_eaten', effects: { chaos: 3 } }
      ]
    },
    fail_eaten: {
      chapter: 'Oops', title: 'Banana Coma',
      text: [
        '"One banana each" turns into every banana in the truck in about four seconds.',

        MI('Uuughhh... bello... banana... no more... ...ok one more.'),
        'Then the truck parks, the doors open, and a squad of guard robots stares at a pile of Minions, a family of five, a dog, and zero bananas.',
        E('Well. This is awkward.'),
        N('Being caught red-handed is bad. Being caught yellow-handed is worse.')
      ],
      choices: [
        { label: '⏪ Rewind to the catapult landing', to: 'travel_catapult' },

      chapter: 'Chapter 3 · Getting There', title: 'Captain Minion',

      choices: [

    },
    lucy_pilot: {
      chapter: 'Chapter 3 · Getting There', title: 'Smooth Landing',

        E('I\'m putting the fart gun on my birthday list.'),

      ],
      choices: [

    lair_lucy: {

      text: [

    banana_vault: {

function resetState() { return { chaos: 0, bananas: 0 }; }

function applyEffects(state, effects) {
  var next = { chaos: state.chaos, bananas: state.bananas };
  if (effects) {
    for (var k in effects) if (k in next) next[k] = Math.max(0, next[k] + effects[k]);
  }
  return next;
}

function pickFinale(state) {
  if (state.chaos >= 8) return 'end_chaos';
  if (state.bananas >= 6) return 'end_hero';
  return 'end_nap';
}
</script>

<script>
(function () {
  var state = resetState();
  var view = document.getElementById('passage');

  function updateStats() {
    document.getElementById('s-bananas').textContent = state.bananas;
    document.getElementById('s-chaos').textContent = state.chaos;
  }

  function deltaText(effects) {
    if (!effects) return '';
    var bits = [];
    if (effects.bananas) bits.push((effects.bananas > 0 ? '+' : '') + effects.bananas + ' 🍌');
    if (effects.chaos) bits.push((effects.chaos > 0 ? '+' : '') + effects.chaos + ' chaos');
    return bits.join('   ');
  }

  function show(id, effects) {
    var p = STORY.passages[id];
    var html = '';
    if (p.chapter) html += '<p class="chapter">' + p.chapter + '</p>';
    html += '<h1>' + p.title + '</h1>';
    var d = deltaText(effects);
    if (d) html += '<p class="delta">' + d + '</p>';
    html += p.text.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (p.ending) {
      html += '<div class="theend"><strong>THE END</strong>Bananas recovered: ' + state.bananas +
        ' · Minion chaos: ' + state.chaos + '<ol class="choices"><li><button type="button" data-restart>' +
        '<span class="key">1</span>Play again</button></li></ol></div>';
    } else {
      html += '<ol class="choices">' + p.choices.map(function (c, i) {
        return '<li><button type="button" data-i="' + i + '"><span class="key">' + (i + 1) + '</span>' + c.label + '</button></li>';
      }).join('') + '</ol>';
    }
    view.className = 'passage';
    view.innerHTML = html;
    void view.offsetWidth;
    view.className = 'passage fade';
    view.dataset.id = id;
    window.scrollTo(0, 0);
  }

  function choose(i) {
    var p = STORY.passages[view.dataset.id];
    var c = p.choices && p.choices[i];
    if (!c) return;
    state = applyEffects(state, c.effects);
    updateStats();
    show(c.to === '@finale' ? pickFinale(state) : c.to, c.effects);
  }

  function restart() {
    state = resetState();
    updateStats();
    show(STORY.start);
  }

  view.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-restart')) restart();
    else choose(+b.dataset.i);
  });
  document.getElementById('restart').addEventListener('click', restart);
  document.addEventListener('keydown', function (e) {
    var n = parseInt(e.key, 10);
    if (!(n >= 1 && n <= 9)) return;
    var p = STORY.passages[view.dataset.id];
    if (p.ending) { if (n === 1) restart(); }
    else choose(n - 1);
  });

  restart();
})();
</script>
